<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order · BrightCart</title>
  <style>
    body { margin:0; font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#1f1720; background:#fff1f5; }
    .bar { background:#fff; border-bottom:1px solid #f3d5de; padding:16px 24px; } .bar a { font-weight:700; font-size:22px; color:#be123c; text-decoration:none; }
    main { max-width:640px; margin:56px auto; padding:0 24px; }
    .panel { background:#fff; border:1px solid #f3d5de; border-radius:16px; padding:28px; }
    h1 { margin:0 0 8px; font-size:30px; } code { font:600 15px ui-monospace, Menlo, monospace; color:#be123c; } p { color:#5b4f57; }
    a.btn { display:inline-block; margin-top:8px; padding:10px 16px; border-radius:10px; background:#be123c; color:#fff; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="bar"><a href="./">BrightCart</a></div>
  <main><div class="panel">
    <h1>Track your order</h1>
    <p>Order <code id="order">-</code></p>
    <p>This is a demo: carrier tracking isn't connected. Fin in the chat has the order's live status, carrier, estimated delivery and latest update from BrightCart's order system.</p>
    <a class="btn" href="./">Back to the Help Center</a>
  </div></main>
  <script>
    var o = new URLSearchParams(location.search).get("order") || "";
    document.getElementById("order").textContent = /^BC-\d{6}$/.test(o) ? o : "-";
  </script>
</body>
</html>
